spring:
  application:
    name: yudao-starter
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:starter}
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 32MB
  jackson:
    serialization:
      write-dates-as-timestamps: true
      write-date-timestamps-as-nanoseconds: false
      write-durations-as-timestamps: true
      fail-on-empty-beans: false
  cache:
    type: REDIS
    redis:
      time-to-live: 1h
  data:
    redis:
      repositories:
        enabled: false
server:
  port: 48080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: NONE
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-aliases-package: ${yudao.info.base-package}.module.*.dal.dataobject
mybatis-plus-join:
  banner: false
easy-trans:
  is-enable-global: false
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
knife4j:
  enable: ${API_DOCS_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
aj:
  captcha:
    cache-type: redis
    type: blockPuzzle
    water-mark: Yudao Starter
    interference-options: 0
    req-frequency-limit-enable: true
yudao:
  info:
    version: 1.0.0
    base-package: cn.iocoder.yudao
  web:
    admin-ui:
      url: ${APP_PUBLIC_URL:http://localhost:8080}
  security:
    mock-enable: false
    password-encoder-length: 10
    permit-all-urls:
      - /actuator/health
      - /actuator/health/**
  captcha:
    enable: true
  demo: false
  access-log:
    enable: true
  api-encrypt:
    enable: false
  websocket:
    enable: true
    path: /infra/ws
    sender-type: local
  swagger:
    title: Yudao Starter
    description: 通用项目基础版
    version: 1.0.0
    url: ${yudao.web.admin-ui.url}
    email: admin@example.invalid
    license: MIT
    license-url: https://opensource.org/licenses/MIT
  codegen:
    base-package: cn.iocoder.yudao
    db-schemas: ${DB_NAME:yudao_starter}
    front-type: 20
    vo-type: 10
    delete-batch-enable: true
    unit-test-enable: false
    import-enable: false
  tenant:
    enable: true
    ignore-visit-urls:
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
    ignore-tables:
      - starter_installation
    ignore-caches:
      - user_role_ids
      - permission_menu_ids
      - oauth_client
      - notify_template
      - mail_account
      - mail_template
      - sms_template
  sms-code:
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
    begin-code: 100000
    end-code: 999999
justauth:
  enabled: false
wx:
  # Upstream social service injects both SDK beans even when social login is unused.
  # Inert placeholders only; real channels must be explicitly configured later.
  mp:
    app-id: starter-not-configured
    secret: starter-not-configured
  miniapp:
    appid: starter-not-configured
    secret: starter-not-configured
