services:
  mysql:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME}
      MYSQL_USER: ${DB_USER:?set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -N -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    image: ${BACKEND_IMAGE:-cdzs-starter/backend:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: starter
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      STARTER_BASELINE_EXISTING: ${STARTER_BASELINE_EXISTING:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      TZ: Asia/Shanghai
    volumes:
      - backend-logs:/app/logs
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:48080/actuator/health]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 18
  frontend:
    image: ${FRONTEND_IMAGE:-cdzs-starter/frontend:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mysql-data:
  redis-data:
  backend-logs:
